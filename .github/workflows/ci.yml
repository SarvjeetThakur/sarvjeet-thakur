# The same four gates AGENTS.md requires before calling work done. The git
# hooks run the first three locally; this is what catches a push that skipped
# them, and it is the only place `pnpm build` runs automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          # Matches the `engines` floor in package.json.
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm build
        env:
          # Baked in at build time, so CI builds what production builds.
          # This does NOT configure the deployed site: Vercel runs its own
          # build and reads its own environment.
          NEXT_PUBLIC_SITE_URL: https://sarvjeet-thakur.vercel.app
